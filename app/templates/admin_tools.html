{% extends 'base.html' %}
{% block content %}
<h2>Gestion des Accès</h2>
<p>Gérez les accès utilisateurs à la plateforme.</p>

<!-- Liste des utilisateurs -->
<h3>Liste des Utilisateurs</h3>
<table border="1">
    <thead>
        <tr>
            <th>UserID</th>
            <th>Nom</th>
            <th>Rôle</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody>
        {% for user in users %}
        <tr>
            <td>{{ user.user_id }}</td>  <!-- Correction : Accès via clé du dictionnaire -->
            <td>{{ user.username }}</td>  <!-- Correction : Affichage du nom utilisateur -->
            <td>{{ user.role }}</td>  <!-- Correction : Affichage du rôle -->
            <td>
                <form method="POST" action="{{ url_for('delete_user', user_id=user.user_id) }}">
                    <button type="submit">Supprimer</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<!-- Formulaire pour ajouter un utilisateur -->
<h3>Ajouter un Utilisateur</h3>
<form method="POST" action="/admin_tools">
    <label for="username">Nom d'utilisateur :</label>
    <input type="text" id="username" name="username" required>
    <br><br>
    <label for="role">Rôle :</label>
    <select id="role" name="role">
        <option value="technicien">Technicien</option>
        <option value="admin">Administrateur</option>
    </select>
    <br><br>
    <label for="password">Mot de passe :</label>
    <input type="password" id="password" name="password" required>
    <br><br>
    <button type="submit">Ajouter l'Utilisateur</button>
</form>
{% endblock %}
