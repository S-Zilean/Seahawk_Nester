<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Titre{% endblock %}</title>

    <!-- Bloc dédié au style personnalisé -->
    {% block stylesheet %}
    {% endblock %}

    <link rel="stylesheet" href="{{ url_for('static', filename='css/base_style/global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base_style/main-container.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base_style/sidebar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base_style/content.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base_style/submenu.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

</head>
<body>
    <div class="main-container">
        <div class="sidebar">
            <div class="app-name">Seahawk Nester</div>
            <ul>
                <li><a href="{{ url_for('base', path='dashboard') }}"><i class="fas fa-home"></i> Accueil</a></li>
                <li><a href="#"><i class="fas fa-user"></i> Profil</a></li>
                <li><a href="#"><i class="fas fa-cog"></i> Paramètres</a></li>
                <li><a href="#"><i class="fas fa-question-circle"></i> Aide</a></li>
                <li><a href="{{ url_for('logout') }}"><i class="fas fa-sign-out-alt"></i> Déconnexion</a></li>
                <li class="franchise-dropdown">
                    <a href="#"><i class="fas fa-list"></i> Liste des franchises</a>
                    <ul class="submenu">
                    {% for franchise in franchises %}

                        <li><a href="{{ url_for('base',path=franchise)}}"><i class="fas fa-building"></i> {{ franchise }}</a></li>
                    {% endfor %}
                    </ul>
                </li>
                <li><a href="#"><i class="fas fa-info-circle"></i> À propos</a></li>
                <li><a href="#"><i class="fas fa-envelope"></i> Contact</a></li>
            </ul>

        </div>
        <div class="content">
            {% block content %}
            {% endblock %}
        </div>
    </div>
</body>
</html>
